# Fork-only test build: unsigned Windows x64 MSI + portable zip for the brush leash preference.
# Lives on the ci/windows-test-build branch of the fork, never in the upstream PR.
name: Windows x64 test build

on:
  push:
    branches: [ci/windows-test-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-windows-x64
      - name: Install WiX
        uses: storytold/craft-common-actions/actions/install-wix@main
      - name: Build and package (unsigned)
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-brush-leash-windows-x64
          path: dist/release/*
          if-no-files-found: error
